# ============================================================
# mcp-stack docker-compose.yml
# Infrastructure-as-code for all MCP servers
# Host: LXC 106 (mcp-stack) on Proxmox, VLAN 11 (192.168.11.6)
# ============================================================

networks:
  mcp-net:
    driver: bridge

services:

  # ----------------------------------------------------------
  # m365-mcp  —  PnP CLI for Microsoft 365
  # Transport: stdio via SSH
  # ----------------------------------------------------------
  m365-mcp:
    build:
      context: ./services/m365-mcp
      dockerfile: Dockerfile
    container_name: m365-mcp
    restart: unless-stopped
    networks:
      - mcp-net
    ports:
      - "3001:3000"
    volumes:
      - m365-auth:/root/.local/share/m365
    environment:
      - NODE_ENV=production
    security_opt:
      - apparmor=unconfined

  # ----------------------------------------------------------
  # ha-mcp  —  Home Assistant MCP server
  # Transport: stdio via SSH
  # ----------------------------------------------------------
  ha-mcp:
    build:
      context: ./services/ha-mcp
      dockerfile: Dockerfile
    container_name: ha-mcp
    restart: unless-stopped
    networks:
      - mcp-net
    environment:
      - HOMEASSISTANT_URL=${HOMEASSISTANT_URL}
      - HOMEASSISTANT_TOKEN=${HOMEASSISTANT_TOKEN}
    security_opt:
      - apparmor=unconfined

  # ----------------------------------------------------------
  # spotify-mcp  —  Spotify playback, playlists, search
  # Transport: stdio via SSH
  # ----------------------------------------------------------
  spotify-mcp:
    build:
      context: ./services/spotify-mcp
      dockerfile: Dockerfile
    container_name: spotify-mcp
    restart: unless-stopped
    networks:
      - mcp-net
    volumes:
      - ./services/spotify-mcp/config/spotify-config.json:/app/spotify-config.json
    security_opt:
      - apparmor=unconfined

  # ----------------------------------------------------------
  # playwright-mcp  —  Headless Chromium for agentic web browsing
  # Transport: SSE on port 3002
  # ----------------------------------------------------------
  playwright-mcp:
    build:
      context: ./services/playwright-mcp
      dockerfile: Dockerfile
    container_name: playwright-mcp
    restart: unless-stopped
    networks:
      - mcp-net
    ports:
      - "3002:3002"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=3002
    security_opt:
      - apparmor=unconfined

  # ----------------------------------------------------------
  # code-review-graph  —  Tree-sitter code intelligence graph for
  # the-real-bojangles/telos, served over MCP for the OC/Telos crew.
  # Read-only mirror, refreshed on an interval. Transport: HTTP on 3003.
  # ----------------------------------------------------------
  code-review-graph:
    build:
      context: ./services/code-review-graph
      dockerfile: Dockerfile
    container_name: code-review-graph
    restart: unless-stopped
    # tini as PID 1: each refresh's `git pull` detaches a background
    # maintenance process that gets reparented to PID 1. Without an init,
    # PID 1 is the Python server, which never reaps them (~300 zombies/day).
    init: true
    networks:
      - mcp-net
    ports:
      - "3003:3003"
    volumes:
      - crg-telos-repo:/app/repo
      - crg-graph-data:/root/.code-review-graph
      - ./services/code-review-graph/keys/crg_telos_deploy:/run/secrets/crg_telos_deploy_key:ro
    environment:
      - GIT_REPO_URL=git@github.com:the-real-bojangles/telos.git
      - MCP_PORT=3003
      - REFRESH_SECONDS=300
    security_opt:
      - apparmor=unconfined

  # ----------------------------------------------------------
  # postgres  —  Shared PostgreSQL for MCP services, OpenClaw, Hermes
  # Port: 5433 (host) → 5432 (container)
  # ----------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: mcp-postgres
    restart: unless-stopped
    networks:
      - mcp-net
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mcp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-mcp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - apparmor=unconfined

  # ----------------------------------------------------------
  # traefik  —  Reverse proxy / TLS termination for *.superg.co
  # Certs via Let's Encrypt + Cloudflare DNS challenge
  # ----------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    networks:
      - mcp-net
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/etc/traefik
    security_opt:
      - apparmor=unconfined
    labels:
      - "traefik.enable=true"

  # ----------------------------------------------------------
  # arr-mcp  —  unified MCP server for the *arr media stack
  # https://github.com/bardesss/arr-mcp
  # ----------------------------------------------------------
  arr-mcp:
    image: ghcr.io/bardesss/arr-mcp:latest
    container_name: arr-mcp
    restart: unless-stopped
    ports:
      - "6060:6060"
    volumes:
      - ./services/arr-mcp/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    security_opt:
      - apparmor=unconfined

  # ----------------------------------------------------------
  # nextdns-mcp  —  NextDNS API MCP server for Jinx (CT 110)
  # https://github.com/dmeiser/nextdns-mcp  (pinned 3.2.5 by digest)
  # Jinx has full read/write on every profile in the account, including profiles it creates later
  # (Guido, 2026-10-10: "If I ask him for a profile, he should be able to configure its settings").
  # "ALL" is the server's allow-all value; a list of IDs would lock out each new profile until
  # someone edited this file, so don't go back to one.
  # No published port: its HTTP transport has no auth, so clients go through nextdns-mcp-auth below.
  # ----------------------------------------------------------
  nextdns-mcp:
    image: ghcr.io/dmeiser/nextdns-mcp:3.2.5@sha256:a52f973aa84cc4e614f2161b6099bf3ee287027876bfb56644ae18023a28729b
    container_name: nextdns-mcp
    restart: unless-stopped
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - NEXTDNS_API_KEY_FILE=/run/secrets/nextdns_api_key
      - NEXTDNS_DEFAULT_PROFILE=3d2183
      - NEXTDNS_READABLE_PROFILES=ALL
      - NEXTDNS_WRITABLE_PROFILES=ALL
      - NEXTDNS_READ_ONLY=false
    volumes:
      - ./services/nextdns-mcp/secrets/nextdns_api_key:/run/secrets/nextdns_api_key:ro
    cap_drop:
      - ALL
    security_opt:
      - apparmor=unconfined
      - no-new-privileges:true
    networks:
      - mcp-net

  # Bearer-token gate for nextdns-mcp (token map in nginx/00-auth.conf,
  # source of record: 1Password OpenClaw-Secrets / "Jinx NextDNS MCP Bearer").
  # Reached from CT 110 over Tailscale: http://100.88.111.96:6070/mcp
  nextdns-mcp-auth:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: nextdns-mcp-auth
    restart: unless-stopped
    depends_on:
      - nextdns-mcp
    ports:
      - "6070:8080"
    volumes:
      - ./services/nextdns-mcp/nginx:/etc/nginx/conf.d:ro
    security_opt:
      - apparmor=unconfined
      - no-new-privileges:true
    networks:
      - mcp-net

volumes:
  m365-auth:
  traefik-acme:
  pgdata:
  crg-telos-repo:
  crg-graph-data:

