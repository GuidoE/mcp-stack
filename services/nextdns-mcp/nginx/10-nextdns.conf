# Bearer-token gate in front of nextdns-mcp, whose HTTP transport has no auth.
# The token map lives in 00-auth.conf (0600, gitignored); source of record is
# 1Password: OpenClaw-Secrets / "Jinx NextDNS MCP Bearer".
server_tokens off;

server {
    listen 8080;

    location = /mcp {
        if ($nextdns_authorized = 0) { return 401; }

        proxy_pass http://nextdns-mcp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # never forward the bearer to the MCP
        proxy_set_header Authorization "";
        # streamable HTTP: SSE responses, long-lived requests
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / { return 404; }
}
